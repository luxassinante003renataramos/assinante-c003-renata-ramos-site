<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Renata Ramos Imóveis PB</title>
  <meta
    name="description"
    content="Escolhas seguras. Conquistas reais. Acesse os imóveis, fale pelo WhatsApp, envie um e-mail ou visite o Instagram de Renata Ramos Imóveis PB."
  >
  <meta name="theme-color" content="#07526c">

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="pagina" aria-label="Cartão digital de Renata Ramos Imóveis PB">
    <div class="cartao">

      <picture>
        <source
          media="(min-width: 900px) and (orientation: landscape)"
          srcset="assets/capa-desktop.png"
        >
        <source
          media="(min-width: 600px)"
          srcset="assets/capa-tablet.png"
        >
        <img
          class="capa"
          src="assets/capa-celular.png"
          alt="Renata Ramos Imóveis PB. Escolhas seguras. Conquistas reais."
          width="1080"
          height="1920"
          decoding="async"
          fetchpriority="high"
        >
      </picture>

      <!--
        SUBSTITUA SOMENTE OS ENDEREÇOS ENTRE ASPAS NOS href.
        Não apague class, target, rel ou aria-label.
      -->

      <a
        class="link-area imoveis"
        href="https://luxmercadoimoveispb.com.br?id=c003"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ver os imóveis de Renata Ramos">
        <span class="somente-leitor">Imóveis</span>
      </a>

      <a
        class="link-area whatsapp"
        href="https://wa.me/5583993088330?text=Ol%C3%A1%2C%20Renata.%20Vi%20seu%20site%20e%20gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20os%20im%C3%B3veis."
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Falar com Renata Ramos pelo WhatsApp">
        <span class="somente-leitor">WhatsApp</span>
      </a>

      <a
        class="link-area email"
        href="mailto:renata.corretorajp@gmail.com?subject=Contato%20pelo%20site%20Renata%20Ramos"
        aria-label="Enviar e-mail para Renata Ramos">
        <span class="somente-leitor">E-mail</span>
      </a>

      <a
        class="link-area instagram"
        href="https://www.instagram.com/renataramos_corretora/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir o Instagram de Renata Ramos">
        <span class="somente-leitor">Instagram</span>
      </a>

    </div>
  </main>
</body>
</html>
